name: check

# Pull requests: tests, registry rules, permanent identifiers, and a live
# probe of every identity provider the pull request adds or changes. Runs
# without secrets and with read-only permissions; the result is written to
# the job summary.
on:
  pull_request:
  # Bot pull requests from registration issues (opened with the workflow
  # token, which starts no pull_request workflow) are checked by dispatch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Dependencies
        run: npm ci --ignore-scripts
      - name: Tests
        run: |
          node scripts/build-assets.mjs --check
          node --test test/*.test.mjs
      - name: Registry
        run: node scripts/check.mjs --base "origin/${{ github.base_ref || 'main' }}" --probe --summary "$GITHUB_STEP_SUMMARY"
