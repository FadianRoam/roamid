name: publish

# Every push to main: run the same checks, build registry.json (with the
# commit it was built from) and publish it to GitHub Pages. RoamID fetches it
# from there every 5 minutes. Uses only the default GITHUB_TOKEN.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tests
        run: node --test test/*.test.mjs
      - name: Registry
        run: |
          if git rev-parse -q --verify HEAD~1 >/dev/null; then base="--base HEAD~1"; else base=""; fi
          node scripts/check.mjs $base --summary "$GITHUB_STEP_SUMMARY"
      - name: Build registry.json
        run: node scripts/build-registry.mjs _site "$GITHUB_SHA"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
