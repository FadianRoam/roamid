name: publish

# Every push to main: run the same checks, build registry.json (with the
# commit it was built from) and publish it to GitHub Pages. RoamID fetches it
# from there every 5 minutes. Uses only the default GITHUB_TOKEN.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Dependencies
        run: npm ci --ignore-scripts
      - name: Tests
        run: |
          node scripts/build-assets.mjs --check
          node --test test/*.test.mjs
      - name: Registry
        run: |
          if git rev-parse -q --verify HEAD~1 >/dev/null; then base="--base HEAD~1"; else base=""; fi
          node scripts/check.mjs $base --summary "$GITHUB_STEP_SUMMARY"
      - name: Build registry.json
        run: node scripts/build-registry.mjs _site "$GITHUB_SHA"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5